<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <header class="header">
      <div class="icon" aria-hidden="true">✓</div>
      <p class="eyebrow">STUDENT TOOL</p>
      <h1>Attendance<br><span>Calculator</span></h1>
      <p class="intro">Keep track of your classes and stay on top of your 75% attendance goal.</p>
    </header>

    <form id="attendanceForm" class="form">
      <label for="totalClasses">Total classes held</label>
      <input id="totalClasses" type="number" min="0" step="1" placeholder="For example, 40" required>

      <label for="attendedClasses">Classes you attended</label>
      <input id="attendedClasses" type="number" min="0" step="1" placeholder="For example, 30" required>

      <button type="submit">Calculate my attendance <span aria-hidden="true">→</span></button>
    </form>

    <section id="result" class="result" aria-live="polite" hidden></section>

    <footer>Made for students · Target attendance: <strong>75%</strong></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
